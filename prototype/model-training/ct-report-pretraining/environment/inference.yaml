# Inference environment for the CT–report managed online endpoint.
# Adds the Azure ML inference server (required for a custom scoring script) on top of the
# training deps. Build/reference via azureml/endpoint/deployment.yml.
name: ct-report-inference-env
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - torch>=2.2
      - numpy>=1.26
      - azureml-inference-server-http
      # Real text tower (Qwen3-0.6B + LoRA). Must match what training used: a qwen-trained
      # model reconstructs the Qwen tower at load, so the tokenizer/config must be reachable
      # offline via CTREPORT_QWEN_DIR + HF_HUB_OFFLINE=1 (see scripts/qwen-text-tower.md).
      - transformers>=4.51
      - peft>=0.11
