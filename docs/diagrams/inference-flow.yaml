  - {id: output,  label: "Output & review"}

nodes:
  - id: arrive
    zone: intake
    conceptual: "Study arrives"
    azure: "Event Grid /\nqueue trigger"
    icon: azure.integration.EventGridTopics
  - id: route
    zone: intake
    conceptual: "Triage / route"
    azure: "Orchestrator\n(Container Apps)"
    icon: azure.compute.ContainerApps
